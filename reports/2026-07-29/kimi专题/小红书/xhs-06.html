</style></head><body><div class="page"><div class="kick">📘 Kimi K3 架构专题 · 龙兄的 Daily Digest</div><div class="sec"><div class="bar"></div><div class="label">位置编码：不要了</div></div><div class="item"><div class="ttl">最大胆的选择</div><div class="body"><p>注意力机制把所有字一起塞进去，不知道谁前谁后，所以常规模型都要注入位置信息，标配是 RoPE。K3 把它整个去掉，这个做法叫 NoPE。</p></div></div><div class="item"><div class="ttl">为什么不会乱</div><div class="body"><p>模型生成时只能看到过去、看不到未来，天然隐含先后关系；KDA 又是按顺序更新记忆，等于自带位置信息。</p><p>RoPE 按训练长度调校，文本一超长就会失准；NoPE 理论上更不在乎长度变化。K3 是第一个在最高规格模型上验证这件事的。</p></div></div><div class="foot">5 / 7</div></div></body></html>
