</style></head><body><div class="page"><div class="kick">📘 Kimi K3 架构专题 · 龙兄的 Daily Digest</div><div class="sec"><div class="bar"></div><div class="label">前馈层：LatentMoE</div></div><div class="item"><div class="ttl">MoE 已是行业共识</div><div class="body"><p>把庞大的前馈层拆成几百个「专家」，每处理一个词只唤醒十多个最相关的。就像医院有几百位专科医生，病人只挂两三个号。K3 总参数 2.8 万亿，每次激活只有一千多亿。</p></div></div><div class="item"><div class="ttl">LatentMoE 再优化一层</div><div class="body"><p>先把输入压缩到一个更小的「潜在空间」再计算，类似把高清照片先做成缩略图再处理。压缩方式设计得好，丢掉的多是冗余信息，搬运和计算大幅减少。这不是 Kimi 原创，别的模型也用过。</p></div></div><div class="foot">3 / 7</div></div></body></html>
