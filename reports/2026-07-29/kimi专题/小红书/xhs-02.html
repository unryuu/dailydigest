</style></head><body><div class="page"><div class="kick">📘 Kimi K3 架构专题 · 龙兄的 Daily Digest</div><div class="sec"><div class="bar"></div><div class="label">大模型的两笔账</div></div><div class="item"><div class="ttl">参数本身</div><div class="body"><p>模型里有几万亿个权重参数，都要放进显存。每吐出一个词，都要把相关的权重搬进芯片做一次乘法。参数越多，存储和计算就越贵。</p></div></div><div class="item"><div class="ttl">工作记忆</div><div class="body"><p>模型每生成一个新词，都要回头看一遍前面的内容。为了不重复计算，它把每个历史词的中间结果缓存下来，这就是 KV 缓存。对话越长缓存越大，处理十万字长文时，这部分成本往往比参数那部分还要命。</p></div></div><div class="item"><div class="body"><p>K3 那些看起来很奇怪的组件，几乎每一个，都是在优化这两笔成本其中的一笔。</p></div></div><div class="foot">1 / 7</div></div></body></html>
